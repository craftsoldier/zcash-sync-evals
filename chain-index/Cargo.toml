[package]
name = "chain-index"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Answers lightwalletd's node questions (tree states, subtree roots, UTXOs) from its own compact-block cache"

[dependencies]
incrementalmerkletree = { version = "0.9", features = ["legacy-api"] }
sapling = { package = "sapling-crypto", version = "0.9" }
orchard = "0.16"
tiny_http = "0.12"
serde_json = "1"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"

[profile.release]
debug = false

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
